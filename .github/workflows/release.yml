# Builds the Kitchen Table release for the VPS (Ubuntu 22.04) when a v* tag is
# pushed, and attaches it to a GitHub release for deploy/deploy.ps1 to fetch.
# With an APP_ADDRESS variable, it adds the Android app to the release too.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # The same Ubuntu as the VPS, so the release's runtime matches its libraries.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.18'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build the release
        working-directory: server
        env:
          MIX_ENV: prod
        run: |
          mix deps.get --only prod
          mix release --overwrite

      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball=kitchen-table-${GITHUB_REF_NAME}.tar.gz
          tar -czf "$tarball" -C server/_build/prod/rel/family .
          gh release create "$GITHUB_REF_NAME" "$tarball" --title "Kitchen Table $GITHUB_REF_NAME" --notes "Built from ${GITHUB_SHA::7}."

  # The Android app, built on Windows as android/build.ps1 expects, set to the
  # site's address (the APP_ADDRESS variable) and signed with a release
  # keystore: the ANDROID_KEYSTORE secret (in base64), its password
  # (ANDROID_KEYSTORE_PASSWORD) and the key's alias (the ANDROID_KEY_ALIAS
  # variable). Without the address or the keystore it's left out, and the
  # server's release stands on its own.
  android:
    needs: release
    if: vars.APP_ADDRESS != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the app
        id: build
        shell: pwsh
        env:
          APP_ADDRESS: ${{ vars.APP_ADDRESS }}
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Signing with a keystore made here would give an app nothing could update.
          if (-not $env:KEYSTORE -or -not $env:KEYSTORE_PASS -or -not $env:KEY_ALIAS) {
            Write-Host '::warning::No Android app in this release: it needs the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD secrets and the ANDROID_KEY_ALIAS variable.'
            exit 0
          }
          $keystore = Join-Path $env:RUNNER_TEMP 'kitchen-table.keystore'
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:KEYSTORE))
          try {
            ./android/build.ps1 -Address $env:APP_ADDRESS -Keystore $keystore -KeyAlias $env:KEY_ALIAS -KeystorePass $env:KEYSTORE_PASS
          } finally {
            Remove-Item $keystore
          }
          if ($LASTEXITCODE -eq 0) { "built=true" >> $env:GITHUB_OUTPUT }

      - name: Add it to the release
        if: steps.build.outputs.built == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Named for the app's own version, which goes up separately from the server's.
          if ((Get-Content android/AndroidManifest.xml -Raw) -notmatch 'android:versionName="([^"]+)"') { throw "Can't find the app's version." }
          $apk = "KitchenTable-$($Matches[1]).apk"
          Copy-Item android/build/KitchenTable.apk $apk
          gh release upload $env:GITHUB_REF_NAME $apk --clobber
